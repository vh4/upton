<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2" />
  
  <!-- Subtle inner border -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Up-ton Arrow & Platform Symbol -->
  <g transform="translate(64, 62)">
    <!-- Arrow Head -->
    <path d="M 0 -26 L 22 -4 L 10 -4 L 10 12 L -10 12 L -10 -4 L -22 -4 Z" fill="url(#accentGrad)" />
    <!-- Horizontal Platform Tray -->
    <path d="M -24 22 L 24 22" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
